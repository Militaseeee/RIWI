<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CRUD Operations - User Admin</title>
    <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>CRUD OPERATIONS</h2>
            <div class="profile">
                <img src="./assets/img/admin.avif" alt="Admin"/>
                <p>Random guy</p>
                <span>Admin</span>
            </div>
            <nav>
                <ul>
                    <li>Home</li>
                    <li>Course</li>
                    <li class="active">Users</li>
                    <li>Payment</li>
                    <li>Report</li>
                    <li>Settings</li>
                </ul>
            </nav>
            <button id="logout">Logout</button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header-container">
                <!-- Fila superior -->
                <div class="top-row">
                    <div class="top-right">
                        <img src="./assets/icons/arrow-left.svg" alt="arrow" class="icon arrow-left-icon"/>
                    </div>
                
                    <div class="top-left">
                        <div class="search-wrapper">
                            <img src="./assets/icons/search.svg" alt="Search" class="search-icon"/>
                            <input type="text" id="searchInput" placeholder="Search..."/>
                        </div>
                        <img src="./assets/icons/notification.svg" alt="Notifications" class="icon notification-icon"/>
                    </div>
                </div>

                <!-- Fila inferior -->
                <div class="student-actions">
                  <h1>Students List</h1>
                    <div class="actions-wrapper">
                        <img src="./assets/icons/select-arrows.svg" alt="select" class="icon select-arrows-icon"/>
                        <button id="addUserBtn">Add New Student</button>
                    </div>
                </div>
            </header>

            <table>
                <thead>
                    <tr>
                        <th>Avatar</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Enroll Number</th>
                        <th>Date of Admission</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Add User</h2>
            <form id="userForm">
                <input type="hidden" id="userId" />
                <input type="text" id="name" placeholder="Full Name" required />
                <input type="email" id="email" placeholder="Email" required />
                <input type="tel" id="phone" placeholder="Phone" required />
                <input type="text" id="enrollNumber" placeholder="Enroll Number" required />
                <input type="date" id="dateOfAdmission" required />
                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/modal.js"></script>
</body>
</html>
