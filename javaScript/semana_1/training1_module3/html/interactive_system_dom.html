<!-- This part is the GraphicMode
It makes the interface look better and more interactive for the user -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <!-- This line connects the Toastify CSS styles to the page -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>Sistema interactivo</title>
</head>
<body>
    <div class="background-img"></div>
    <section class="container">
        <a href="../index.html" class="back-button" title="Go-back">
            <img src="../img/arrow.png" alt="back" class="back-icon">
        </a>
        <h1>Welcome to the graphic console!</h1>
        <p>
            In this program, please enter your age to find out if you are ready to start learning 
            different programming languages. Based on your age, you will receive a helpful suggestion 
            to guide you on your path to becoming a great programmer.
        </p>

        <div class="form">
            <input type="text" id="nameUser" class="style-form" placeholder="Name">
            <input type="number" id="age" class="style-form" placeholder="Age">
        </div>
        <div class="buttons">
            <!-- Search this function to apply it in the code -->
            <a onclick="verifyAge()" class="button button-dom" role="button">Verify your age</a>
            <!-- <a onclick="deleteInfo()" class="button button-delete" role="button">Delete Data</a> -->
        </div>
    </section>
    <!-- This line conected with js -->
    <script src="../js/sistema_interactivo.js"></script>
    <!-- This line connects the Toastify JavaScript library to the page -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
