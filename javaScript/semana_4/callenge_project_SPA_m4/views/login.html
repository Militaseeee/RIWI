<section class="login">
    <h2>Login</h2>
    <form id="login">
        <label for="user">User:</label>
        <input type="text" id="user" id="user" required/>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required/>
        
        <button type="submit">Log In</button>
    </form>
</section>
